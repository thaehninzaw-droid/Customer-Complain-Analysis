<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Loopline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="13" cy="13" r="12" stroke="#2C5F63" stroke-width="1.6"/>
        <path d="M5 13.5H9.5L11.5 8L14.5 18L16.5 13.5H21" stroke="#3F8489" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Loopline
    </a>
    <div class="nav-links">
      <a href="index.html#about">About Us</a>
      <a href="index.html#contact">Contact Us</a>
      <a href="index.html#survey">Survey</a>
      <a href="index.html#chat">AI Chat</a>
    </div>
    <div class="nav-auth">
      <a href="signup.html" class="btn btn-ghost btn-sm">Sign up instead</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <form class="auth-card" id="login-form">
    <span class="eyebrow">Welcome back</span>
    <h2>Log in to Loopline</h2>
    <p style="margin-bottom: 1.4rem;">Enter your details to pick up where you left off.</p>
    <div class="field">
      <label for="l-email">Email</label>
      <input id="l-email" type="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="l-password">Password</label>
      <div class="pw-field">
        <input id="l-password" type="password" placeholder="••••••••" required>
        <button type="button" class="pw-toggle" data-target="l-password" aria-label="Show password">
          <svg class="icon-eye" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1 9C1 9 4 3.5 9 3.5C14 3.5 17 9 17 9C17 9 14 14.5 9 14.5C4 14.5 1 9 1 9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
          <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:none;"><path d="M1 9C1 9 4 3.5 9 3.5C14 3.5 17 9 17 9C17 9 14 14.5 9 14.5C4 14.5 1 9 1 9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/><line x1="2" y1="16" x2="16" y2="2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
    <div class="divider">or</div>
    <button type="button" class="btn btn-ghost btn-block" id="guest-btn">Continue as guest</button>
    <p class="auth-switch">Don't have an account? <a href="signup.html" style="color:var(--teal-dark); font-weight:600;">Sign up</a></p>
  </form>
</div>

<div class="toast" id="toast"></div>
<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
