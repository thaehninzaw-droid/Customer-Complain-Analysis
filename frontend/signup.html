<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Loopline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="13" cy="13" r="12" stroke="#2C5F63" stroke-width="1.6"/>
        <path d="M5 13.5H9.5L11.5 8L14.5 18L16.5 13.5H21" stroke="#3F8489" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Loopline
    </a>
    <div class="nav-links">
      <a href="index.html#about">About Us</a>
      <a href="index.html#contact">Contact Us</a>
      <a href="activities.html">Activities</a>
      <a href="index.html#survey">Survey</a>
      <a href="index.html#chat">AI Chat</a>
    </div>
    <div class="nav-auth">
      <a href="login.html" class="btn btn-ghost btn-sm">Log in instead</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <form class="auth-card" id="signup-form">
    <span class="eyebrow">Get started</span>
    <h2>Create your account</h2>
    <p style="margin-bottom: 1.4rem;">Create an account to file and track complaints.</p>
    <div class="field">
      <label for="su-name">Full name</label>
      <input id="su-name" type="text" placeholder="Your name" required>
    </div>
    <div class="field">
      <label for="su-email">Email</label>
      <input id="su-email" type="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="su-password">Password</label>
      <input id="su-password" type="password" placeholder="••••••••" required>
      <ul class="pw-checklist" id="pw-checklist">
        <li data-rule="length">At least 8 characters</li>
        <li data-rule="upper">One uppercase letter</li>
        <li data-rule="special">One special character (!@#$%^&*)</li>
      </ul>
    </div>
    <div class="field">
      <label for="su-confirm">Confirm password</label>
      <input id="su-confirm" type="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
    <p class="auth-switch">Already have an account? <a href="login.html" style="color:var(--teal-dark); font-weight:600;">Log in</a></p>
  </form>
</div>

<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
